name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Media Access Control
  MACOS_DEPLOYMENT_TARGET: '10.13'
  BASE_DIR: test
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: source-release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate immutable source and availability before native work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Clean exact Windows outputs
        shell: pwsh
        run: .github/scripts/windows.ps1 clean
      - name: Build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      - name: Verify exact vcxproj output
        shell: pwsh
        run: .github/scripts/windows.ps1 verify
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.BASE_DIR }}/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUNDLE_PATH: test/Plugins/Media Access Control.bundle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate initial checkout
        run: python3 .github/scripts/release.py initial
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild
      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" --keychain "$KEYCHAIN_PATH"
      - name: Build fresh canonical macOS output
        run: |
          bash .github/scripts/native.sh clean
          bash .github/scripts/native.sh build
          bash .github/scripts/native.sh verify
      - name: Merge Windows output
        run: bash .github/scripts/native.sh merge
      - name: Sign
        run: bash .github/scripts/native.sh sign
      - name: Package, notarize and staple
        run: bash .github/scripts/native.sh package
      - name: Revalidate built metadata and create-only publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
