name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Semantic version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: source-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Commit source version on the selected branch
        env:
          BUMP_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/bump.py
